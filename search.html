<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบสถานะพัสดุ - RMU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6 mt-6">
    <div class="flex items-center justify-between mb-4">
      <a href="index.html" class="text-xs text-gray-500 hover:text-gray-800">← กลับหน้าแรก</a>
    </div>
    
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-amber-900 flex items-center justify-center gap-2">
        📦 ตรวจสอบสถานะพัสดุ (RMU)
      </h1>
      <p class="text-gray-500 text-sm mt-1">ค้นหาด้วยรหัสนักศึกษา/บุคลากร หรือ เลข Tracking</p>
    </div>

    <div class="flex gap-2 mb-6">
      <input type="text" id="searchInput" placeholder=" " 
             class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
      <button onclick="searchPackages()" 
              class="bg-amber-800 text-white px-6 py-3 rounded-lg hover:bg-amber-900 transition font-medium">
        🔍 ค้นหา
      </button>
    </div>

    <div id="resultsContainer" class="space-y-3">
      <p class="text-center text-gray-400 py-4">กรอกข้อมูลด้านบนเพื่อเริ่มค้นหาพัสดุ</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pgngqmgxszvkpfrcjlzb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_vAjq59xuDxRfK1pniL2snA_5TSspWZm';
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function searchPackages() {
      const keyword = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('resultsContainer');

      if (!keyword) {
        alert('กรุณากรอกรหัสนักศึกษา หรือ เลข Tracking ก่อนกดค้นหา');
        return;
      }

      container.innerHTML = '<p class="text-center text-gray-500 py-4">กำลังค้นหาข้อมูล...</p>';

      const { data, error } = await supabaseClient
        .from('packages')
        .select('*')
        .or(`student_id.eq.${keyword},tracking_number.eq.${keyword}`)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p class="text-center text-red-500 py-4">เกิดข้อผิดพลาด: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-6">❌ ไม่พบข้อมูลพัสดุในระบบ</p>';
        return;
      }

      container.innerHTML = data.map(item => {
        const isWaiting = item.status === 'waiting';
        const statusBadge = isWaiting 
          ? `<span class="bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full">🟡 รอรับพัสดุ</span>`
          : `<span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">🟢 รับพัสดุแล้ว</span>`;

        const date = new Date(item.created_at).toLocaleString('th-TH');

        return `
          <div class="border rounded-xl p-4 bg-gray-50 hover:bg-gray-100 transition shadow-sm">
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="font-bold text-gray-800 text-lg">${item.tracking_number}</span>
                <span class="text-sm text-gray-500 ml-2">(${item.carrier})</span>
              </div>
              ${statusBadge}
            </div>
            <div class="text-sm text-gray-600 space-y-1">
              <p>👤 ผู้รับ: <span class="font-medium text-gray-800">${item.student_name}</span> (${item.student_id})</p>
              <p>🕒 วันที่เข้า: ${date}</p>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
